name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax
        run: |
          find hub agent tools -name '*.mjs' -o -name '*.js' -o -name '*.cjs' | sort | while read -r f; do
            node --check "$f" || exit 1
          done

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Go (the Car Thing's Bluetooth helper)
        working-directory: carthing/phonelink
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null .

      - name: Shell syntax
        run: |
          for f in carthing/*.sh tools/*.sh host/*.sh; do bash -n "$f" || exit 1; done

      - name: config.json parses
        run: |
          node -e "JSON.parse(require('fs').readFileSync('hub/config.json', 'utf8'))"

      - name: Tests
        env:
          TZ: UTC
        run: node --test hub/test/*.test.mjs
