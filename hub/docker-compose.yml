services:
  hub:
    image: node:22-bookworm-slim
    container_name: carthing-hub
    restart: unless-stopped
    working_dir: /app
    command: ["node", "server/index.mjs"]
    user: "node"
    env_file: .env
    environment:
      TZ: America/Los_Angeles
    ports:
      - "10.42.1.6:8787:8787"   # Car Thing (USB)
      - "10.10.10.20:8787:8787" # LAN preview
    volumes:
      - ./server:/app/server:ro
      - ./public:/app/public:ro
      - ./config.json:/app/config.json:ro
      - ./state:/app/state
      - ./host-report:/app/host:ro   # host-report.sh and check-carthing.sh write here from cron
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    depends_on: [docker-status]
    networks: [default, speech]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Read-only container summary for the Servers page. Holds docker.sock so the hub does not have to.
  # Not published on any host port; only reachable from the hub on this compose network.
  docker-status:
    image: node:22-bookworm-slim
    container_name: carthing-docker-status
    restart: unless-stopped
    command: ["node", "/app/docker-status.mjs"]
    user: "node"
    group_add: ["983"]
    volumes:
      - ./server/docker-status.mjs:/app/docker-status.mjs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 16

  # Speech to text for short spoken commands (server/commands.mjs). On the internal "speech" network only:
  # no published port and no route out, so it can talk to the hub and nothing else.
  whisper:
    build: ./whisper
    image: carthing-whisper:1.7.6
    container_name: carthing-whisper
    restart: unless-stopped
    # -ac 256: a 5-second window instead of 30, plenty for a command and about 4 times faster
    command: ["--host", "0.0.0.0", "--port", "8080", "-m", "/models/ggml-small-q5_1.bin", "-t", "4", "-l", "auto", "-nt", "-ac", "256"]
    volumes:
      - ./whisper-models:/models:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 4
    pids_limit: 32
    networks: [speech]

networks:
  speech:
    internal: true
